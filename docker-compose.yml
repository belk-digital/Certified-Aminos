version: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: certifiedaminos
      POSTGRES_PASSWORD: certifiedaminos
      POSTGRES_DB: certifiedaminos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
